name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache: false

      - name: Verify gofmt
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            echo
            gofmt -d .
            exit 1
          fi

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache: false

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache: false

      - name: Run tests
        env:
          KCD2_REQUIRE_SYMLINK_TESTS: "1"
        run: go test ./...

  windows-build:
    name: Windows amd64 build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache: false

      - name: Run Windows tests
        shell: pwsh
        env:
          KCD2_REQUIRE_SYMLINK_TESTS: "1"
        run: go test ./...

      - name: Build Windows executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/kcd2-dual-subtitles.exe ./cmd/kcd2-dual-subtitles

      - name: Smoke-test native GUI entrypoint
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\kcd2-dual-subtitles.exe" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(10)
            $title = ""
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.HasExited) {
                throw "GUI process exited before creating a window (exit code $($process.ExitCode))"
              }
              $title = $process.MainWindowTitle
            } while ([string]::IsNullOrWhiteSpace($title) -and (Get-Date) -lt $deadline)

            if ($title -ne "KCD2 Dual Subtitles dev") {
              throw "Native GUI application window was not observed; title='$title'"
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Smoke-test CLI entrypoint
        shell: pwsh
        run: |
          $version = (& .\dist\kcd2-dual-subtitles.exe --version).Trim()
          if ($version -ne "kcd2-dual-subtitles dev") {
            throw "Unexpected --version output: '$version'"
          }
          $help = (& .\dist\kcd2-dual-subtitles.exe --help) -join "`n"
          if ($help -notmatch "Usage:") {
            throw "--help did not produce CLI usage output"
          }

      - name: Package Windows distribution
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "dev"

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: kcd2-dual-subtitles-windows-amd64
          path: |
            dist/kcd2-dual-subtitles.exe
            dist/kcd2-dual-subtitles-dev-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
